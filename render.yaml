# Render Blueprint: New > Blueprint > pick this repository. One web service built from the Dockerfile.
#
# The free plan (512 MB, a small share of a CPU, no disk) cannot run the local Whisper model, so the image is built
# without it (DOWNLOAD_MODELS=0). Speech recognition is then chosen automatically:
#   * add GROQ_API_KEY (free key from console.groq.com) -> Groq Whisper large-v3-turbo on the server, plus the AI
#     scorer and AI-worded follow-ups with Groq's open models (recommended);
#   * no key -> the student's browser recognises speech (Chrome or Edge), and the rule-based scorer marks.
# Without a disk, data resets when the service restarts or sleeps (after 15 idle minutes); the demo faculty,
# question banks and the five sample vivas are loaded again on every start. For real use pick a paid plan with a disk
# mounted at /data, or run docker compose on a college server.
services:
  - type: web
    name: vaani
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DOWNLOAD_MODELS          # build argument: leave Whisper out of the image on the free plan
        value: "0"
      - key: SEED_DEMO
        value: "true"
      - key: TTS_ENGINE               # the examiner speaks with the browser's voice (no server CPU)
        value: browser
      - key: GROQ_API_KEY             # optional but recommended; paste your key in the Render dashboard
        sync: false
      - key: ADMIN_PASSWORD           # the administrator account (admin@vaani.local); set your own
        sync: false
      - key: DEMO_FACULTY_PASSWORD    # the demo faculty account (faculty@vaani.local); blank = faculty123
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      - key: WORKER_CONCURRENCY
        value: "1"
